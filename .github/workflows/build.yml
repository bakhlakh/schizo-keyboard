name: Build Executables

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Build
        run: uv run pyinstaller --onefile --windowed --name keyboard-randomizer main.py

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: dist/keyboard-randomizer.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install system libraries
        run: sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: uv sync

      - name: Build
        run: uv run pyinstaller --onefile --name keyboard-randomizer-linux main.py

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: dist/keyboard-randomizer-linux

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Build
        run: uv run pyinstaller --onefile --windowed --name keyboard-randomizer-macos main.py

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: dist/keyboard-randomizer-macos
